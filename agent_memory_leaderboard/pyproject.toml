[project]
name = "agent-memory-leaderboard"
version = "0.1.0"
description = "Agent Memory Leaderboard Add/Search adapter for Memoria"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
evaluation = ["tiktoken>=0.12,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
