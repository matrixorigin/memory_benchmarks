name: AML Aliyun dev deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview or deploy the independent Memoria and adapter stack
        type: choice
        options: [preview, deploy]
        default: preview
      memoria_build_mode:
        description: Use the configured mode, build Memoria from source, or use a pinned image
        type: choice
        options: [configured, source, image]
        default: configured
      memoria_ref:
        description: Memoria branch, tag or commit SHA; blank uses configured ref (default main)
        type: string
        required: false
  push:
    branches: [main]
    paths: ['agent_memory_leaderboard/**', 'deploy/**', '.github/workflows/aml-dev-deploy.yml']

permissions:
  contents: read

concurrency:
  group: aml-aliyun-unit-new-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AML_DEV_CD_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AML_FREEZE: ${{ vars.AML_FREEZE }}
      AML_EXPECTED_API_SERVER: ${{ vars.AML_EXPECTED_API_SERVER }}
      AML_EXPECTED_CLUSTER_UID: ${{ vars.AML_EXPECTED_CLUSTER_UID }}
      AML_DATABASE_ACCOUNT: ${{ vars.AML_DATABASE_ACCOUNT }}
      AML_ADAPTER_WORKERS: ${{ vars.AML_ADAPTER_WORKERS }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_TOKEN }}
      AML_KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
      AML_REGISTRY_USERNAME: ${{ secrets.NEW_ACR_USERNAME }}
      AML_REGISTRY_PASSWORD: ${{ secrets.NEW_ACR_PASSWORD }}
      AML_MEMORIA_IMAGE: ${{ vars.AML_MEMORIA_IMAGE }}
      AML_MEMORIA_BUILD_MODE: ${{ inputs.memoria_build_mode != 'configured' && inputs.memoria_build_mode || vars.AML_MEMORIA_BUILD_MODE }}
      AML_MEMORIA_REF: ${{ inputs.memoria_ref || vars.AML_MEMORIA_REF }}
      AML_MEMORIA_REPOSITORY: ${{ vars.AML_MEMORIA_REPOSITORY }}
      AML_ADAPTER_REPOSITORY: ${{ vars.AML_ADAPTER_REPOSITORY }}
      AML_DATABASE_PASSWORD: ${{ secrets.AML_DATABASE_PASSWORD }}
      AML_MEMORIA_MASTER_KEY: ${{ secrets.AML_MEMORIA_MASTER_KEY }}
      AML_ADAPTER_API_KEY: ${{ secrets.AML_ADAPTER_API_KEY }}
      AML_EMBEDDING_API_KEY: ${{ secrets.AML_EMBEDDING_API_KEY }}
      AML_PUBLIC_HOST: ${{ vars.AML_PUBLIC_HOST }}
      AML_TLS_SECRET: ${{ vars.AML_TLS_SECRET }}
      AML_CERT_ISSUER: ${{ vars.AML_CERT_ISSUER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check evaluation release freeze
        env:
          AML_OPERATION: ${{ github.event_name == 'push' && 'deploy' || inputs.operation }}
        run: python3 deploy/scripts/deployment_guard.py --operation "$AML_OPERATION"
      - name: Generate private target configuration
        run: python3 deploy/scripts/dev_config.py
      - name: Select the Memoria source ref or pinned image
        id: memoria
        run: python3 deploy/scripts/memoria_image.py resolve --publish
      - name: Check out the selected Memoria source
        if: steps.memoria.outputs.mode == 'source'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.memoria.outputs.source_repository }}
          ref: ${{ steps.memoria.outputs.source_ref }}
          path: .memoria-source
          persist-credentials: false
      - name: Record the actual Memoria source commit
        if: steps.memoria.outputs.mode == 'source'
        id: memoria_checkout
        run: python3 deploy/scripts/memoria_image.py checkout
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: agent_memory_leaderboard/uv.lock
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: deploy/pulumi/go.mod
          cache-dependency-path: deploy/pulumi/go.sum
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.28.9
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.4
      - name: Install deployment helpers
        run: |
          uv venv .deploy-venv
          uv pip install --require-hashes --only-binary=:all: --python .deploy-venv/bin/python -r deploy/requirements.txt
      - name: Check required configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          names = ['PULUMI_ACCESS_TOKEN', 'AML_KUBECONFIG_CONTENT',
                   'AML_REGISTRY_USERNAME', 'AML_REGISTRY_PASSWORD',
                   'AML_DATABASE_PASSWORD', 'AML_MEMORIA_MASTER_KEY',
                   'AML_ADAPTER_API_KEY', 'AML_EMBEDDING_API_KEY', 'AML_ADAPTER_REPOSITORY']
          missing = [name for name in names if not os.getenv(name)]
          if missing:
              raise SystemExit('Missing configuration: ' + ', '.join(missing))
          if not re.fullmatch(r'registry\.cn-hangzhou\.aliyuncs\.com/[a-z0-9_-]+/[a-z0-9_.-]+', os.environ['AML_ADAPTER_REPOSITORY']):
              raise SystemExit('AML_ADAPTER_REPOSITORY must be a Hangzhou ACR repository')
          PY
      - name: Verify dev cluster, RBAC and storage
        run: .deploy-venv/bin/python deploy/scripts/preflight.py
      - name: Run offline checks
        working-directory: agent_memory_leaderboard
        run: |
          uv sync --locked
          uv run ruff check src tests benchmarks ../deploy/scripts
          uv run pytest -q
      - name: Build deployment program
        working-directory: deploy/pulumi
        run: go build -mod=readonly -o /tmp/aml-pulumi .
      - name: Lint and render both chart variants
        run: python3 deploy/scripts/render_chart.py
      - name: Prepare project, date and commit image tags
        id: image_tags
        run: python3 deploy/scripts/memoria_image.py tags
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.NEW_ACR_USERNAME }}
          password: ${{ secrets.NEW_ACR_PASSWORD }}
      - name: Build and publish the adapter
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: agent_memory_leaderboard
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_tags.outputs.adapter_tag }}
          cache-from: type=gha,scope=aml-adapter
          cache-to: type=gha,mode=max,scope=aml-adapter
      - name: Build and publish Memoria from the selected source
        if: steps.memoria.outputs.mode == 'source'
        id: memoria_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .memoria-source
          file: deploy/docker/memoria.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_tags.outputs.memoria_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ steps.memoria.outputs.source_repository }}
            org.opencontainers.image.revision=${{ steps.memoria_checkout.outputs.source_commit }}
          cache-from: type=gha,scope=aml-memoria-${{ steps.memoria.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=aml-memoria-${{ steps.memoria.outputs.cache_scope }}
      - name: Pin and record the Memoria deployment image
        env:
          BUILT_MEMORIA_DIGEST: ${{ steps.memoria_image.outputs.digest }}
        run: python3 deploy/scripts/memoria_image.py pin
      - name: Save the Memoria build record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memoria-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy/memoria-build.json
          if-no-files-found: error
          retention-days: 30
      - name: Pin the adapter digest
        env:
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('AML_ADAPTER_IMAGE=' + os.environ['AML_ADAPTER_REPOSITORY'] + '@' + os.environ['BUILT_DIGEST'] + '\n')
          PY
      - name: Preview the independent dev stack
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'preview'
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: preview
          stack-name: MatrixOneCloud/memory-benchmarks/new-dev
          work-dir: deploy/pulumi
          upsert: true
          comment-on-pr: false
      - name: Recheck evaluation release freeze before deployment
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        run: python3 deploy/scripts/deployment_guard.py --operation deploy
      - name: Deploy the independent dev stack
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: up
          stack-name: MatrixOneCloud/memory-benchmarks/new-dev
          work-dir: deploy/pulumi
          upsert: true
          comment-on-pr: false
      - name: Wait for the public certificate
        if: (github.event_name == 'push' || inputs.operation == 'deploy') && env.AML_PUBLIC_HOST != ''
        run: kubectl -n aml-memory-benchmarks wait --for=condition=Ready certificate/aml-tls --timeout=20m
      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = os.getenv('KUBECONFIG', '')
          if path and Path(path).is_file() and Path(path).name.startswith('aml-dev-'):
              Path(path).unlink()
          PY
