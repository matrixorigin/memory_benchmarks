name: AML offline CI

on:
  pull_request:
    paths: ['agent_memory_leaderboard/**', 'deploy/**', '.github/workflows/aml-ci.yml', '.github/workflows/aml-dev-deploy.yml']
  push:
    branches: [main]
    paths: ['agent_memory_leaderboard/**', 'deploy/**', '.github/workflows/aml-ci.yml', '.github/workflows/aml-dev-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: agent_memory_leaderboard

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: agent_memory_leaderboard/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check src tests benchmarks ../deploy/scripts ../deploy/tests
      - run: uv run pytest -q
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.4
      - name: Lint and render both chart variants
        working-directory: .
        run: python3 deploy/scripts/render_chart.py
      - name: Test application update selection
        working-directory: .
        run: |
          uv venv .deploy-venv
          uv pip install --require-hashes --only-binary=:all: --python .deploy-venv/bin/python -r deploy/requirements.txt
          .deploy-venv/bin/python -m unittest discover -s deploy/tests -v
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: agent_memory_leaderboard
          push: false
          cache-from: type=gha,scope=aml-adapter
          cache-to: type=gha,mode=max,scope=aml-adapter
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: deploy/pulumi/go.mod
          cache-dependency-path: deploy/pulumi/go.sum
      - name: Validate GitHub Actions workflows
        working-directory: .
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Compile Pulumi program
        working-directory: deploy/pulumi
        run: go build -mod=readonly -o /tmp/aml-pulumi .
      - name: Test retained Pulumi release configuration
        working-directory: deploy/pulumi
        run: go test -mod=readonly ./...
  memoria-source:
    name: Build Memoria from source without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select the configured Memoria source ref
        id: memoria
        env:
          AML_MEMORIA_REF: ${{ vars.AML_MEMORIA_REF }}
        run: python3 deploy/scripts/memoria_image.py resolve --mode source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.memoria.outputs.source_repository }}
          ref: ${{ steps.memoria.outputs.source_ref }}
          path: .memoria-source
          persist-credentials: false
      - name: Record the actual Memoria source commit
        id: memoria_checkout
        run: python3 deploy/scripts/memoria_image.py checkout
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Memoria
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .memoria-source
          file: deploy/docker/memoria.Dockerfile
          platforms: linux/amd64
          push: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ steps.memoria.outputs.source_repository }}
            org.opencontainers.image.revision=${{ steps.memoria_checkout.outputs.source_commit }}
          cache-from: type=gha,scope=aml-memoria-${{ steps.memoria.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=aml-memoria-${{ steps.memoria.outputs.cache_scope }}
